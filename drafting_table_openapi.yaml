# OpenAPI description for a ChatGPT custom GPT action (or any HTTP tool) that drives the Drafting Table.
#
# The app's API listens on 127.0.0.1:8765, which ChatGPT cannot reach. To use this, expose the port
# over HTTPS with a tunnel you control (for example cloudflared or ngrok), then replace the server URL
# below with that address. Anyone who has the address and the token can change your board, so keep
# the tunnel running only while you use it.
#
# In ChatGPT: create a GPT, open Configure > Actions, paste this file, and set Authentication to
# "API Key", type "Bearer", with the token from ~/.drafting_table_token.

openapi: 3.1.0
info:
  title: Drafting Table
  version: "1.0"
  description: Read, add and remove items on the user's Drafting Table board.
servers:
  - url: https://YOUR-TUNNEL-ADDRESS
paths:
  /board:
    get:
      operationId: getBoard
      summary: List everything on the board, with ids, types, positions, text and pinned state.
      responses:
        "200":
          description: The board.
          content:
            application/json:
              schema: { type: object }
  /items:
    post:
      operationId: addItems
      summary: >-
        Add items. Types: note (sticky text, optional background), line and arrow (x1,y1,x2,y2),
        highlight and stroke (points list). Coordinates run 0-3000 across and 0-2200 down.
        Colours: Ink, Red, Blue, Green, or hex like #aabbcc.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    required: [type]
                    properties:
                      type:
                        type: string
                        enum: [note, line, arrow, highlight, stroke]
                      text: { type: string }
                      x: { type: number }
                      y: { type: number }
                      x1: { type: number }
                      y1: { type: number }
                      x2: { type: number }
                      y2: { type: number }
                      points:
                        type: array
                        items:
                          type: array
                          items: { type: number }
                      color: { type: string }
                      background: { type: string }
      responses:
        "200":
          description: Added. Returns the new ids.
          content:
            application/json:
              schema: { type: object }
  /items/delete:
    post:
      operationId: deleteItems
      summary: Remove items by id. Pinned items are skipped and reported.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  maxItems: 200
                  items: { type: integer }
      responses:
        "200":
          description: Removed ids, skipped pinned ids and not-found ids.
          content:
            application/json:
              schema: { type: object }
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
security:
  - bearerToken: []
